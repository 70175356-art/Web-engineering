<!DOCTYPE html>
<html>
<head>
  <title>Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>
</head>
<body>

<nav class="bg-blue-600 p-4 text-white flex justify-between">
  <b>MyApp</b>
  <div class="space-x-4">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="signup.html">Sign Up</a>
    <a href="signin.html">Sign In</a>
  </div>
</nav>

<div class="max-w-xl mx-auto p-8">
  <h1 class="text-4xl font-bold mb-6">Contact Us</h1>

  <div class="bg-blue-50 p-4 mb-4 rounded">📧 Email: tubasajid@myapp.com</div>
  <div class="bg-green-50 p-4 mb-4 rounded">📞 Phone: 0300-1234567</div>
  <div class="bg-yellow-50 p-4 mb-4 rounded">📍 Location: Lahore, Pakistan</div>

  <form action="https://formspree.io/f/YOUR_FORMSPREE_ID"
        method="POST"
        class="space-y-4">

    <input type="text" name="name" required
      placeholder="Your Name"
      class="w-full p-3 border rounded">

    <input type="email" name="email" required
      placeholder="Your Email"
      class="w-full p-3 border rounded">

    <input type="text" name="subject" required
      placeholder="Subject"
      class="w-full p-3 border rounded">

    <textarea name="message" required
      placeholder="Message"
      class="w-full p-3 border rounded"></textarea>

    <button class="bg-blue-600 text-white px-6 py-3 rounded">
      Send Message
    </button>
  </form>
</div>

<footer class="bg-gray-800 text-white text-center p-5">
  My website
</footer>

</body>
</html>
